<head>
  <meta charset="utf-8">
  <meta name="generator" content="Hugo {{ hugo.Version }} - Florilège theme">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>{{ site.Title }}{{ with .Title }} - {{ . }}{{ end }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{{ "css/normalize.css" | relURL }}">
  <link rel="stylesheet" media="screen" href="{{ "css/main.css" | relURL }}" title="Base">

  {{ with site.Params.favicon }}<link rel="icon" href="{{ . | relURL }}">{{ end }}

  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .Permalink }}">{{ end }}
</head>
